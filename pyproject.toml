[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-valuation-agent"
version = "0.1.0"
description = "A human-in-the-loop vehicle valuation workflow assistant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "openpyxl>=3.1",
    "streamlit>=1.40",
    "rapidocr>=3.0",
    "onnxruntime>=1.20",
    "requests>=2.32",
    "beautifulsoup4>=4.13",
    "pypdf>=5.0",
    "jieba>=0.42",
    "rank-bm25>=0.2",
    "faiss-cpu>=1.9",
    "python-docx>=1.1",
    "numpy>=1.26",
    "playwright>=1.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
